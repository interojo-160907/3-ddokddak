name: Build and publish installer

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Published installer to test against every prior release from v2.6.4'
        required: true
        default: 'v2.7.10'
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Verify restored source
        shell: pwsh
        run: python .github/scripts/verify-restored-source.py

      - name: Run regression tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Test central safe mode selection
        shell: pwsh
        run: |
          node management/test_safe_mode.cjs
          node management/test_multi_program.cjs

      - name: Build application
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean production3.spec

      - name: Test packaged executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'package-smoke.json'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process 'dist\production3\gui_app_pyside6.exe' -ArgumentList '--package-smoke-test', ('"' + $report + '"') -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Packaged executable failed to finish startup smoke test.'
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw 'Packaged executable smoke test failed.' }
          if (-not (Get-Content -LiteralPath $report -Raw | ConvertFrom-Json).ok) { throw 'Invalid smoke result.' }
          Get-Content -LiteralPath $report

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "installer\production3.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify direct upgrades from all published versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'installer\output\ddokddak-production3-setup-*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate historical installers.' }
          $priorVersions = @($releases | Where-Object {
            -not $_.isDraft -and $_.tagName -match '^v\d+\.\d+\.\d+$' -and
            [version]$_.tagName.TrimStart('v') -ge [version]'2.6.4' -and
            [version]$_.tagName.TrimStart('v') -lt [version]$version
          } | Sort-Object { [version]$_.tagName.TrimStart('v') })
          if ($priorVersions.Count -lt 10) { throw 'Incomplete historical release list.' }
          foreach ($prior in $priorVersions) {
            $priorDir = Join-Path $env:RUNNER_TEMP ('production3-prior-' + $prior.tagName)
            gh release download $prior.tagName --repo $env:GITHUB_REPOSITORY --pattern 'ddokddak-production3-setup.exe' --dir $priorDir
            if ($LASTEXITCODE -ne 0) { throw "Cannot fetch legacy installer: $($prior.tagName)" }
            & '.github\scripts\test-installer-upgrade.ps1' -PriorInstaller (Join-Path $priorDir 'ddokddak-production3-setup.exe') -Installer $installer.FullName -ExpectedVersion $version -PriorVersion $prior.tagName.TrimStart('v')
          }

      - name: Prepare release assets
        shell: pwsh
        run: |
          $versioned = Get-ChildItem "installer\output\ddokddak-production3-setup-*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $versioned) { throw "Installer output was not created." }
          $asset = "installer\output\ddokddak-production3-setup.exe"
          Copy-Item -LiteralPath $versioned.FullName -Destination $asset -Force
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ddokddak-production3-setup.exe" |
            Set-Content "installer\output\ddokddak-production3-setup.exe.sha256" -Encoding ascii

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $asset = "installer\output\ddokddak-production3-setup.exe"
          $hash = "$asset.sha256"
          gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG_NAME $asset $hash --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $env:TAG_NAME --latest --notes-file "RELEASE_NOTES_$env:TAG_NAME.md" --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG_NAME $asset $hash --notes-file "RELEASE_NOTES_$env:TAG_NAME.md" --latest `
              --title $env:TAG_NAME --repo $env:GITHUB_REPOSITORY
          }

  all-version-upgrades:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every published upgrade path
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetDir = Join-Path $env:RUNNER_TEMP 'production3-upgrade-target'
          gh release download $env:TARGET_VERSION --repo $env:GITHUB_REPOSITORY --pattern 'ddokddak-production3-setup.exe' --dir $targetDir
          if ($LASTEXITCODE -ne 0) { throw 'Target installer download failed.' }
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate published versions.' }
          $versions = @($releases | Where-Object {
            -not $_.isDraft -and $_.tagName -match '^v\d+\.\d+\.\d+$' -and
            [version]$_.tagName.TrimStart('v') -ge [version]'2.6.4' -and
            [version]$_.tagName.TrimStart('v') -lt [version]$env:TARGET_VERSION.TrimStart('v')
          } | Sort-Object { [version]$_.tagName.TrimStart('v') })
          if ($versions.Count -lt 10) { throw 'Incomplete historical release list.' }
          $results = @()
          foreach ($release in $versions) {
            $tag = $release.tagName
            $priorDir = Join-Path $env:RUNNER_TEMP ('production3-prior-' + $tag)
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern 'ddokddak-production3-setup.exe' --dir $priorDir
            if ($LASTEXITCODE -ne 0) { throw "Legacy installer download failed: $tag" }
            & '.github\scripts\test-installer-upgrade.ps1' -PriorInstaller (Join-Path $priorDir 'ddokddak-production3-setup.exe') -Installer (Join-Path $targetDir 'ddokddak-production3-setup.exe') -ExpectedVersion $env:TARGET_VERSION.TrimStart('v') -PriorVersion $tag.TrimStart('v')
            $results += [pscustomobject]@{ from=$tag; to=$env:TARGET_VERSION; status='passed' }
          }
          $results | ConvertTo-Json | Set-Content 'upgrade-results.json' -Encoding utf8
          $results | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-compatibility-results
          path: upgrade-results.json
