name: Verify recovery source and signing gate

on:
  push:
    branches: ['codex/v2.7.10-signing']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - shell: pwsh
        run: python -m pip install -r requirements.txt
      - name: Verify unchanged recovery behavior
        shell: pwsh
        run: python .github/scripts/verify-restored-source.py
      - name: Test application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Test management and signing gate
        shell: pwsh
        run: |
          node management/test_safe_mode.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node management/test_multi_program.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .github/scripts/test-signing-gate.ps1
